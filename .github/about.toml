#
# cargo-about configuration for THIRD-PARTY-NOTICES.txt, shipped in every release archive.
# Keep `accepted` in step with the [licenses] allow list in deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "GPL-3.0-or-later",
    "AGPL-3.0-or-later",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }
