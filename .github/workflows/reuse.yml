#
# REUSE 3.3 compliance gate: verifies that every file in the repository is
# mapped in REUSE.toml and that all referenced SPDX license texts exist in LICENSES/.

name: REUSE

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: REUSE 3.3 Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6
