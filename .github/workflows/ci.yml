name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly: new RustSec advisories appear without any change here.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides which jobs a pull request needs. Only pull requests are filtered; main always runs the
  # full suite. Jobs are skipped with a job-level `if`, never a workflow-level `paths` filter: a
  # skipped job counts as passing for required status checks, so the check names in the
  # repository ruleset still report on every pull request.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      deps: ${{ steps.filter.outputs.deps }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          all() { for k in rust deps scripts; do echo "$k=$1" >> "$GITHUB_OUTPUT"; done; }
          case "$EVENT" in
            # Pushes to main always run everything: the release gate
            # (.github/scripts/release-ci-gate.py) requires every CI job on the tagged commit to
            # have concluded `success`, and a skipped job does not.
            push|workflow_dispatch) all true; exit 0 ;;
            schedule) printf 'rust=false\ndeps=true\nscripts=false\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # A new branch, a force push or an unknown base: run everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            all true; exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          # Editing this workflow re-runs everything it gates.
          ci='^\.github/workflows/ci\.yml$'
          {
            echo "rust=$(has "^(crates/|fuzz/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.cargo/)|$ci")"
            echo "deps=$(has "(^|/)Cargo\.(toml|lock)$|^deny\.toml$|^\.github/about\.|$ci")"
            echo "scripts=$(has "^scripts/|^\.github/scripts/|$ci")"
          } >> "$GITHUB_OUTPUT"
      - name: Summary
        run: |
          echo "rust=${{ steps.filter.outputs.rust }} deps=${{ steps.filter.outputs.deps }} scripts=${{ steps.filter.outputs.scripts }}" >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Format, Clippy, Test, Docs, Benchmark & Self-Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST: ${{ needs.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        if: env.RUST == 'true'
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: env.RUST == 'true'
        with:
          # Pull requests restore main's cache but never write their own, which keeps the
          # repository cache small and the main-branch entry warm.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        if: env.RUST == 'true'
        run: cargo fmt --all -- --check
      - name: Enforce workspace-wide zero-unsafe policy
        if: env.RUST == 'true'
        run: |
          if ! grep -Eq '^unsafe_code = "forbid"$' Cargo.toml; then
            echo "ERROR: root Cargo.toml must set unsafe_code = \"forbid\"" >&2
            exit 1
          fi
          for manifest in crates/*/Cargo.toml; do
            if grep -Eq 'unsafe_code[[:space:]]*=' "$manifest"; then
              echo "ERROR: $manifest overrides workspace unsafe_code policy" >&2
              exit 1
            fi
            if ! grep -A2 '^\[lints\]$' "$manifest" | grep -Eq '^workspace = true$'; then
              echo "ERROR: $manifest must inherit workspace lints ([lints] workspace = true)" >&2
              exit 1
            fi
          done
          if grep -rnE '(allow|expect)\(unsafe_code\)|\bunsafe[[:space:]]*(\(|(async[[:space:]]+)?(\{|fn\b|trait\b|impl\b|extern\b))' crates/; then
            echo "ERROR: unsafe code is strictly forbidden across the Infinity-Context workspace" >&2
            exit 1
          fi
      - name: Run Clippy
        if: env.RUST == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        if: env.RUST == 'true'
        run: cargo test --workspace
      - name: Build docs
        if: env.RUST == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Run benchmark & SLO gate
        if: env.RUST == 'true'
        run: cargo run --release -p icx-cli -- benchmark
      - name: Run CLI doctor check
        if: env.RUST == 'true'
        run: cargo run --release -p icx-cli -- doctor
      - name: Antigravity reviewer self-test
        run: bash scripts/agy-review-selftest.sh
      - name: CLA script self-test
        run: bash .github/scripts/cla-check.sh --selftest
      - name: Release CI gate self-test (offline)
        run: python3 .github/scripts/test-release-ci-gate.py
      - name: Benchmark series self-test (offline)
        run: python3 scripts/test_benchmark_series.py

  deny:
    name: Dependency Advisories, Licenses & Bans (cargo-deny)
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.21.0
      - name: cargo deny check
        run: cargo deny --workspace check
      - name: Install cargo-about
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about@0.9.3
      - name: Third-party notices generate (release.yml packages them)
        run: |
          cargo about generate --locked --fail -c .github/about.toml .github/about.hbs \
            -o "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt"
          grep -c '^====' "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt"

  coverage:
    name: Code Coverage (Codecov)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "coverage"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Generate LCOV coverage report & enforce coverage floor
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info --fail-under-lines 95
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  secrets:
    name: Secret Scan (gitleaks)
    # Every change, including documentation: secrets land in prose and configs too.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          rm "$RUNNER_TEMP/gitleaks.tgz"
      - name: Verify secret allowlist boundaries
        run: python3 .github/scripts/test-gitleaks-allowlists.py "$RUNNER_TEMP/gitleaks"
      - name: Scan git history (including merge-commit patches)
        run: |
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history -m" --no-banner --redact --exit-code 1
      - name: Verify merge-commit secret detection fixture
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          git -C "$tmpdir" init -q -b main
          git -C "$tmpdir" config user.name "Test"
          git -C "$tmpdir" config user.email "test@example.com"
          echo "clean" > "$tmpdir/file.txt"
          git -C "$tmpdir" add file.txt
          git -C "$tmpdir" commit -q -m "init"
          git -C "$tmpdir" checkout -q -b side
          echo "side" > "$tmpdir/side.txt"
          git -C "$tmpdir" add side.txt
          git -C "$tmpdir" commit -q -m "side"
          git -C "$tmpdir" checkout -q main
          echo "main2" > "$tmpdir/main2.txt"
          git -C "$tmpdir" add main2.txt
          git -C "$tmpdir" commit -q -m "main2"
          git -C "$tmpdir" merge -q --no-commit side
          hdr_begin="-----BEGIN OPENSSH"
          hdr_end="-----END OPENSSH"
          key_tail="PRIVATE KEY-----"
          b64_line="$(printf 'synthetic-merge-commit-test-private-key-payload-0123456789abcdef' | base64 -w0)"
          printf '%s %s\n%s\n%s %s\n' \
            "$hdr_begin" "$key_tail" \
            "$b64_line" \
            "$hdr_end" "$key_tail" > "$tmpdir/merge_only.key"
          git -C "$tmpdir" add merge_only.key
          git -C "$tmpdir" commit -q -m "merge with evil resolution"
          rc=0
          "$RUNNER_TEMP/gitleaks" git "$tmpdir" --log-opts="--all --full-history -m" --no-banner --redact --exit-code 42 || rc=$?
          if [ "$rc" -ne 42 ]; then
            echo "ERROR: expected gitleaks detection exit code 42 for synthetic merge secret, got $rc" >&2
            exit 1
          fi
