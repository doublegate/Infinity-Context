#
# Documentation site: built with Zensical on every pull request that touches the docs (strict,
# so a broken link fails the check) and deployed to GitHub Pages from main.
name: Docs

on:
  push:
    branches: [main]
    paths: &docs-paths
      - "docs/**"
      # Pages link to source, test, plan and reference files: renaming one must re-check links.
      - "crates/**"
      - "to-dos/**"
      - "ref-docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "PROJECT-STATUS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "LICENSING.md"
      - "assets/**"
      - "images/**"
      - "zensical.toml"
      - "scripts/build_docs_site.py"
      - "scripts/site/**"
      - ".github/docs-requirements.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site (Zensical, strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/docs-requirements.txt
      # The verified MathJax package (SHA-512 pinned in scripts/build_docs_site.py) is cached, so
      # most runs make no registry request (#36).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .site-cache
          key: docs-site-cache-${{ hashFiles('scripts/build_docs_site.py') }}
      - name: Install Zensical (hash-locked, including dependencies)
        run: python -m pip install --require-hashes -r .github/docs-requirements.txt
      - name: Stage pages and build
        run: |
          python3 scripts/build_docs_site.py
          zensical build --clean --strict -f .site-src/zensical.toml
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site-src/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
