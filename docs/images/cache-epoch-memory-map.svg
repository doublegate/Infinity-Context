<text x="32" y="40" fill="#f8fafc" font-size="23" font-weight="700">Managed context: four budgeted zones</text>
<text x="32" y="68" fill="#b4c0d0" font-size="14">Immutable cold storage does not require every historical frame to appear in every emitted window.</text>
<rect x="32" y="94" width="552" height="142" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
<text x="50" y="123" fill="#38bdf8" font-size="17" font-weight="700">Zone 0: head</text>
<text x="50" y="148" fill="#f8fafc" font-size="14">Caller-provided head and AHTL legend</text>
<text x="50" y="169" fill="#f8fafc" font-size="14">Included in the managed allowance</text>
<text x="50" y="190" fill="#f8fafc" font-size="14">External instructions/current message/tools:</text>
<text x="50" y="211" fill="#f8fafc" font-size="14">caller reserves enough external allowance</text>
<rect x="616" y="94" width="552" height="142" rx="10" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
<text x="634" y="123" fill="#a78bfa" font-size="17" font-weight="700">Zone 1: selected sealed epochs</text>
<text x="634" y="148" fill="#f8fafc" font-size="14">Cold epoch bytes remain immutable</text>
<text x="634" y="169" fill="#f8fafc" font-size="14">Select only frames that fit the configured policy</text>
<text x="634" y="190" fill="#f8fafc" font-size="14">Paging or policy changes may alter emitted prefix</text>
<text x="634" y="211" fill="#f8fafc" font-size="14">Provider cache-hit rates are not guaranteed</text>
<rect x="32" y="254" width="552" height="142" rx="10" fill="#111827" stroke="#34d399" stroke-width="2"/>
<text x="50" y="283" fill="#34d399" font-size="17" font-weight="700">Zone 2: recent active frames</text>
<text x="50" y="308" fill="#f8fafc" font-size="14">Prioritize useful whole recent frames</text>
<text x="50" y="329" fill="#f8fafc" font-size="14">Older detail remains recoverable through CAS</text>
<text x="50" y="350" fill="#f8fafc" font-size="14">Epoch sealing threshold is configurable</text>
<text x="50" y="371" fill="#f8fafc" font-size="14">Default epoch threshold: 4096 conservative units</text>
<rect x="616" y="254" width="552" height="142" rx="10" fill="#111827" stroke="#fb923c" stroke-width="2"/>
<text x="634" y="283" fill="#fb923c" font-size="17" font-weight="700">Zone 3: structured tail</text>
<text x="634" y="308" fill="#f8fafc" font-size="14">Header / best recall, then bus and PPR frames</text>
<text x="634" y="329" fill="#f8fafc" font-size="14">Default cap: 1024 conservative units</text>
<text x="634" y="350" fill="#f8fafc" font-size="14">Compact handles; no arbitrary byte-cut frames</text>
<text x="634" y="371" fill="#f8fafc" font-size="14">Unsent bus events remain pending</text>
<rect x="32" y="414" width="552" height="142" rx="10" fill="#111827" stroke="#f472b6" stroke-width="2"/>
<text x="50" y="443" fill="#f472b6" font-size="17" font-weight="700">Default managed allowance</text>
<text x="50" y="468" fill="#f8fafc" font-size="14">32768 context - 4096 completion - 4096 external</text>
<text x="50" y="489" fill="#f8fafc" font-size="14">= 24576 UTF-8 bytes for managed text</text>
<text x="50" y="510" fill="#f8fafc" font-size="14">Estimator: utf8-bytes-upper-bound-v1</text>
<text x="50" y="531" fill="#f8fafc" font-size="14">One UTF-8 byte per conservative token allowance</text>
<rect x="616" y="414" width="552" height="142" rx="10" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
<text x="634" y="443" fill="#22d3ee" font-size="17" font-weight="700">Boundary of this guarantee</text>
<text x="634" y="468" fill="#f8fafc" font-size="14">The selected managed text is bounded</text>
<text x="634" y="489" fill="#f8fafc" font-size="14">The caller budgets all external request content</text>
<text x="634" y="510" fill="#f8fafc" font-size="14">Native host transcripts can retain original output</text>
<text x="634" y="531" fill="#f8fafc" font-size="14">No whole-provider-request or billing guarantee</text>
