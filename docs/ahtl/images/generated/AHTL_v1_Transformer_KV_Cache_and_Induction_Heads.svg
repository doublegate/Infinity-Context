  <rect width="1600" height="920" rx="18" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <text x="800" y="46" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold">
