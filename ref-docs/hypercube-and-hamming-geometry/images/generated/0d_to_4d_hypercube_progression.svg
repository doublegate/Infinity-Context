<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 440" width="1360" height="440">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 10; }
      .title { font-family: "DejaVu Sans", "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #e6edf3; }
      .subtitle { font-family: "DejaVu Sans", "Segoe UI", sans-serif; font-size: 13px; fill: #8b949e; }
      .label { font-family: "DejaVu Sans Mono", monospace; font-size: 13.5px; font-weight: 700; fill: #58a6ff; }
      .math { font-family: "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #c9d1d9; }
      .dim { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #7ee787; }
      .edge { stroke: #58a6ff; stroke-width: 2.2; fill: none; }
      .edge-inner { stroke: #d2a8ff; stroke-width: 2.0; fill: none; }
      .edge-bridge { stroke: #7ee787; stroke-width: 1.6; stroke-dasharray: 4,3; fill: none; }
      .node { fill: #f0883e; stroke: #0d1117; stroke-width: 1.5; }
    </style>
  </defs>
  <rect class="bg" width="1360" height="440"/>
  <text x="30" y="38" class="title">Minkowski Sum Progression of n-Cubes (γ_n / Q_n): 0-Cube to 4-Cube (Tesseract)</text>
  <text x="30" y="60" class="subtitle">Each dimension sweeps the (n-1)-cube along an orthogonal basis vector e_n: E_{m,n} = 2 E_{m,n-1} + E_{m-1,n-1}, f-vector polynomial (2x + 1)^n</text>

  <!-- 0-cube (x=25, w=246) -->
  <rect class="card" x="25" y="80" width="246" height="330"/>
  <text x="43" y="110" class="label">n = 0 : 0-Cube (Monon)</text>
  <text x="43" y="130" class="dim">Schläfli: ( ) | Coxeter: γ_0</text>
  <circle class="node" cx="148" cy="215" r="7"/>
  <text x="138" y="242" class="math">()</text>
  <text x="43" y="315" class="math">Vertices (0-faces): 2^0 = 1</text>
  <text x="43" y="335" class="math">Edges (1-faces):    0</text>
  <text x="43" y="355" class="math">f-vector:           (1)</text>
  <text x="43" y="375" class="math">Diagonal:           √0 = 0</text>

  <!-- 1-cube (x=291, w=246) -->
  <rect class="card" x="291" y="80" width="246" height="330"/>
  <text x="309" y="110" class="label">n = 1 : 1-Cube (Dion)</text>
  <text x="309" y="130" class="dim">Schläfli: { } | Coxeter: γ_1</text>
  <line class="edge" x1="350" y1="215" x2="478" y2="215"/>
  <circle class="node" cx="350" cy="215" r="6"/>
  <circle class="node" cx="478" cy="215" r="6"/>
  <text x="344" y="242" class="math">0</text>
  <text x="473" y="242" class="math">1</text>
  <text x="309" y="315" class="math">Vertices (0-faces): 2^1 = 2</text>
  <text x="309" y="335" class="math">Edges (1-faces):    1·2^0 = 1</text>
  <text x="309" y="355" class="math">f-vector:           (2, 1)</text>
  <text x="309" y="375" class="math">Diagonal:           √1 = 1</text>

  <!-- 2-cube (x=557, w=246) -->
  <rect class="card" x="557" y="80" width="246" height="330"/>
  <text x="575" y="110" class="label">n = 2 : 2-Cube (Square)</text>
  <text x="575" y="130" class="dim">Schläfli: {4} | Coxeter: γ_2</text>
  <rect class="edge" x="630" y="165" width="100" height="100"/>
  <circle class="node" cx="630" cy="165" r="5.5"/>
  <circle class="node" cx="730" cy="165" r="5.5"/>
  <circle class="node" cx="630" cy="265" r="5.5"/>
  <circle class="node" cx="730" cy="265" r="5.5"/>
  <text x="605" y="160" class="math">01</text>
  <text x="738" y="160" class="math">11</text>
  <text x="605" y="282" class="math">00</text>
  <text x="738" y="282" class="math">10</text>
  <text x="575" y="315" class="math">Vertices (0-faces): 2^2 = 4</text>
  <text x="575" y="335" class="math">Edges (1-faces):    2·2^1 = 4</text>
  <text x="575" y="355" class="math">f-vector:           (4, 4, 1)</text>
  <text x="575" y="375" class="math">Diagonal:           √2 ≈ 1.414</text>

  <!-- 3-cube (x=823, w=246) -->
  <rect class="card" x="823" y="80" width="246" height="330"/>
  <text x="841" y="110" class="label">n = 3 : 3-Cube (Cube)</text>
  <text x="841" y="130" class="dim">Schläfli: {4,3} | Coxeter: γ_3</text>
  <rect class="edge" x="885" y="185" width="85" height="85"/>
  <rect class="edge-inner" x="920" y="155" width="85" height="85"/>
  <line class="edge-bridge" x1="885" y1="185" x2="920" y2="155"/>
  <line class="edge-bridge" x1="970" y1="185" x2="1005" y2="155"/>
  <line class="edge-bridge" x1="885" y1="270" x2="920" y2="240"/>
  <line class="edge-bridge" x1="970" y1="270" x2="1005" y2="240"/>
  <circle class="node" cx="885" cy="185" r="5"/>
  <circle class="node" cx="970" cy="185" r="5"/>
  <circle class="node" cx="885" cy="270" r="5"/>
  <circle class="node" cx="970" cy="270" r="5"/>
  <circle class="node" cx="920" cy="155" r="5"/>
  <circle class="node" cx="1005" cy="155" r="5"/>
  <circle class="node" cx="920" cy="240" r="5"/>
  <circle class="node" cx="1005" cy="240" r="5"/>
  <text x="841" y="315" class="math">Vertices: 8  | Edges: 12</text>
  <text x="841" y="335" class="math">Faces (2-cubes): 6</text>
  <text x="841" y="355" class="math">f-vector: (8, 12, 6, 1)</text>
  <text x="841" y="375" class="math">Diagonal: √3 ≈ 1.732</text>

  <!-- 4-cube (x=1089, w=246) -->
  <rect class="card" x="1089" y="80" width="246" height="330"/>
  <text x="1107" y="110" class="label">n = 4 : 4-Cube (Tesseract)</text>
  <text x="1107" y="130" class="dim">Schläfli: {4,3,3} | Coxeter: γ_4</text>
  <rect class="edge" x="1152" y="150" width="120" height="120"/>
  <rect class="edge-inner" x="1184" y="182" width="56" height="56"/>
  <line class="edge-bridge" x1="1152" y1="150" x2="1184" y2="182"/>
  <line class="edge-bridge" x1="1272" y1="150" x2="1240" y2="182"/>
  <line class="edge-bridge" x1="1152" y1="270" x2="1184" y2="238"/>
  <line class="edge-bridge" x1="1272" y1="270" x2="1240" y2="238"/>
  <circle class="node" cx="1152" cy="150" r="4.5"/>
  <circle class="node" cx="1272" cy="150" r="4.5"/>
  <circle class="node" cx="1152" cy="270" r="4.5"/>
  <circle class="node" cx="1272" cy="270" r="4.5"/>
  <circle class="node" cx="1184" cy="182" r="4.5"/>
  <circle class="node" cx="1240" cy="182" r="4.5"/>
  <circle class="node" cx="1184" cy="238" r="4.5"/>
  <circle class="node" cx="1240" cy="238" r="4.5"/>
  <text x="1107" y="315" class="math">Vertices: 16 | Edges: 32</text>
  <text x="1107" y="335" class="math">Squares: 24  | Cubes: 8</text>
  <text x="1107" y="355" class="math">f-vector: (16, 32, 24, 8, 1)</text>
  <text x="1107" y="375" class="math">Diagonal: √4 = 2.000</text>
</svg>