# See LICENSING.md, PATENTS.md, COMMERCIAL.md, and CLA.md for full details.

version = 1

# ---------------------------------------------------------------------------
# 1. Default First-Party Code & Project Files: GPL-3.0-or-later
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  "*",
  ".ai-memory.toml",
  ".coderabbit.yaml",
  ".editorconfig",
  ".gitignore",
  ".gitleaks.toml",
  ".markdownlint.json",
  ".github/**",
  "crates/icx-core/**",
  "crates/icx-hdc/**",
  "crates/icx-codec/**",
  "crates/icx-store/**",
  "crates/icx-bus/**",
  "crates/icx-cli/**",
  "scripts/**",
  "to-dos/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 DoubleGate"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "First-party Infinity-Context (icx) workspace code, scripts, and project configuration under GPL-3.0-or-later."

# ---------------------------------------------------------------------------
# 2. Networked Proxy, MCP Server & Agent Interception Crates:
#    Dual Copyleft (GPL-3.0-or-later AND AGPL-3.0-or-later)
#    Enforces Section 13 Remote Network Interaction copyleft on hosted/SaaS
#    proxy or MCP server deployments unless a Commercial License is obtained.
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  "crates/icx-proxy/**",
  "crates/icx-adapters/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 DoubleGate"
SPDX-License-Identifier = "GPL-3.0-or-later AND AGPL-3.0-or-later"
SPDX-FileComment = "Network-facing wire proxy, MCP server, and agent adapter crates governed by GPL-3.0-or-later and AGPL-3.0-or-later (Section 13 remote network interaction)."

# ---------------------------------------------------------------------------
# 3. Architectural Specifications, Research Synthesis, Diagrams & Branding:
#    CC-BY-NC-ND-4.0 AND LicenseRef-InfinityContext-Commercial
#    Permits non-commercial viewing/sharing with attribution while prohibiting
#    commercial re-implementation or derivative commercial specs without a license.
# ---------------------------------------------------------------------------
# Note: "ref-docs/**" below is intentionally overridden for third-party academic
# preprints ("ref-docs/papers/*.pdf") by Block 6 at the bottom of this file.
[[annotations]]
path = [
  "docs/**",
  "images/**",
  "assets/**",
  "ref-docs/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 DoubleGate"
SPDX-License-Identifier = "CC-BY-NC-ND-4.0 AND LicenseRef-InfinityContext-Commercial"
SPDX-FileComment = "Original Infinity-Context technical specifications, mathematical derivations, forensic reports, and artwork; non-commercial no-derivatives with commercial & patent reservation."

# ---------------------------------------------------------------------------
# 4. Commercial, Patent & Licensing Governance Documents
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  "PATENTS.md",
  "COMMERCIAL.md",
  "LICENSING.md",
  "CLA.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 DoubleGate"
SPDX-License-Identifier = "GPL-3.0-or-later AND LicenseRef-InfinityContext-Commercial"
SPDX-FileComment = "Patent reservation, commercial licensing, and contributor license agreement documents."

# ---------------------------------------------------------------------------
# 5. Contributor Covenant Code of Conduct (CC-BY-4.0)
# ---------------------------------------------------------------------------
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = [
  "2014 Coraline Ada Ehmke and the Contributor Covenant contributors",
  "2026 DoubleGate",
]
SPDX-License-Identifier = "CC-BY-4.0"
SPDX-FileComment = "Adapted from the Contributor Covenant Code of Conduct v2.1 (CC-BY-4.0)."

# ---------------------------------------------------------------------------
# 6. Reference Academic Preprints (ref-docs/papers/*.pdf)
# ---------------------------------------------------------------------------
[[annotations]]
path = "ref-docs/papers/*.pdf"
precedence = "override"
SPDX-FileCopyrightText = "The respective arXiv paper authors cataloged in ref-docs/papers/INDEX.md"
SPDX-License-Identifier = "CC-BY-4.0 OR LicenseRef-arXiv-NonExclusive"
SPDX-FileComment = "Academic preprints downloaded from arXiv.org for the research corpus; see ref-docs/papers/INDEX.md for per-paper authors and arXiv IDs."

# ---------------------------------------------------------------------------
# 7. Retrieved Wikipedia & Wikimedia Commons Reference Archives
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  "docs/ahtl/images/retrieved/**",
  "ref-docs/unicode-braille-patterns/images/retrieved/**",
  "ref-docs/unicode-braille-patterns/wikipedia_*",
  "ref-docs/blake3-cryptographic-hash/images/retrieved/**",
  "ref-docs/blake3-cryptographic-hash/wikipedia_*",
  "ref-docs/hypercube-and-hamming-geometry/images/retrieved/**",
  "ref-docs/hypercube-and-hamming-geometry/wikipedia_*",
  "ref-docs/ahtl-foundations/images/retrieved/**",
  "ref-docs/ahtl-foundations/wikipedia_*",
]
precedence = "override"
SPDX-FileCopyrightText = "Wikimedia Foundation contributors and respective Wikimedia Commons authors"
SPDX-License-Identifier = "CC-BY-SA-4.0 OR CC0-1.0"
SPDX-FileComment = "Archival snapshots of Wikipedia articles and Wikimedia Commons technical figures cataloged in each ref-docs/<topic>/README.md."

# ---------------------------------------------------------------------------
# 8. Unicode Consortium & ISO/IEC JTC1/SC2/WG2 Archival Documents
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  "ref-docs/unicode-braille-patterns/Unicode_U2800_Braille_Patterns_Chart.pdf",
  "ref-docs/unicode-braille-patterns/standards-and-wg2/**",
]
precedence = "override"
SPDX-FileCopyrightText = "1991-2026 Unicode, Inc. and ISO/IEC JTC1/SC2/WG2 contributors"
SPDX-License-Identifier = "Unicode-3.0"
SPDX-FileComment = "Unicode Standard code chart, UCD data files, UTC minutes, and ISO/IEC JTC1/SC2/WG2 archival proposals for the U+2800..U+28FF Braille Patterns block."

# ---------------------------------------------------------------------------
# 9. Official BLAKE3 Cryptographic Specification Preprint
# ---------------------------------------------------------------------------
[[annotations]]
path = "ref-docs/blake3-cryptographic-hash/BLAKE3_Official_Specification.pdf"
precedence = "override"
SPDX-FileCopyrightText = "2020 Jack O'Connor, Jean-Philippe Aumasson, Samuel Neves, and Zooko Wilcox-O'Hearn"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = "Official BLAKE3 cryptographic hash function specification placed in the public domain (CC0-1.0) by the BLAKE3 team."

# ---------------------------------------------------------------------------
# 10. AHTL Diagram & PDF Volume Generator Scripts
# ---------------------------------------------------------------------------
[[annotations]]
path = "docs/ahtl/*.py"
precedence = "override"
SPDX-FileCopyrightText = "2026 DoubleGate"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "First-party deterministic SVG diagram and PDF specification volume builders under GPL-3.0-or-later."
