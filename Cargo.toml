[workspace]
resolver = "2"
members = [
    "crates/icx-core",
    "crates/icx-hdc",
    "crates/icx-codec",
    "crates/icx-store",
    "crates/icx-bus",
    "crates/icx-adapters",
    "crates/icx-proxy",
    "crates/icx-cli",
]
exclude = ["fuzz"]

[workspace.package]
version = "1.3.2"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
similar_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
naive_bytecount = "allow"
needless_range_loop = "allow"
return_self_not_must_use = "allow"
format_push_string = "allow"
collapsible_if = "allow"
large_stack_arrays = "allow"
uninlined_format_args = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
redundant_else = "allow"
doc_markdown = "allow"

[workspace.dependencies]
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["event", "fs", "net", "process"] }
# Pure-Rust zstd decoder for compressed Codex rollouts (T-62-004): no C toolchain; the default
# `hash` feature verifies frame checksums.
ruzstd = "0.9.1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
icx-core = { path = "crates/icx-core", version = "1.3.2" }
icx-hdc = { path = "crates/icx-hdc", version = "1.3.2" }
icx-codec = { path = "crates/icx-codec", version = "1.3.2" }
icx-store = { path = "crates/icx-store", version = "1.3.2" }
icx-bus = { path = "crates/icx-bus", version = "1.3.2" }
icx-adapters = { path = "crates/icx-adapters", version = "1.3.2" }
icx-proxy = { path = "crates/icx-proxy", version = "1.3.2" }
