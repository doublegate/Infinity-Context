# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit AI configuration for Infinity-Context (icx).
# Configured to collaborate cleanly alongside Antigravity PR Review (`agy`),
# OpenAI Codex, GitHub Copilot Code Review, and Codecov.

language: "en-US"
early_access: false
enable_free_tier: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false
  poem: false

  path_filters:
    - "!ref-docs/papers/**"
    - "!assets/**"
    - "!images/**"
    - "!docs/images/**"
    - "!target/**"

  path_instructions:
    - path: "crates/**"
      instructions: |
        Review Rust workspace crates against Infinity-Context (`icx`) systems invariants:
        1. `#[forbid(unsafe_code)]` is enforced in 7 of 8 crates (`icx-core`, `icx-hdc`, `icx-codec`, `icx-store`, `icx-adapters`, `icx-proxy`, `icx-cli`).
        2. `unsafe` is permitted ONLY inside `crates/icx-bus` for POSIX `/dev/shm` `mmap` and seqlock volatile operations over `#[repr(C, align(64))]` structures, and every `unsafe` block must carry an explicit `// SAFETY:` invariant comment.
        3. `crates/icx-codec/src/redact.rs` (`SecretRedactor`) MUST sanitize secrets and escape `AHTL` delimiters BEFORE any `BLAKE3` hashing or `/dev/shm` broadcast. Note that `crates/icx-codec/src/redact.rs` intentionally contains synthetic unit-test credential fixtures allowlisted in `.gitleaks.toml`.
        4. `crates/icx-adapters`: `AntigravityAdapter::exit_code()` MUST always return `0` (exit code `2` triggers an emergency abort in `agy`).
        5. Zero panics/unwraps on untrusted external input (tool stdout/stderr, JSON-RPC payloads, or corrupted CAS blobs).
    - path: ".github/**"
      instructions: |
        Review GitHub Actions workflows and helper scripts for POSIX/Bash safety (`set -euo pipefail`, proper quoting, bounded retries, and offline `--selftest` coverage).
        Note that this repository coordinates multiple automated reviewers (`Antigravity PR Review` via `agy` on a self-hosted runner, `CodeRabbit`, `Codex`, `GitHub Copilot`, and `Codecov`); never suggest modifying or deleting another reviewer bot's comments or workflow markers (`<!-- antigravity-pr-review -->`, `<!-- infinity-context-cla-check -->`).
    - path: "REUSE.toml"
      instructions: |
        Verify that all new paths remain 100% REUSE 3.3 compliant (`uvx reuse lint`): `GPL-3.0-or-later` for core crates/scripts, `GPL-3.0-or-later AND AGPL-3.0-or-later` for `icx-proxy` and `icx-adapters`, and `CC-BY-NC-ND-4.0 AND LicenseRef-InfinityContext-Commercial` for specifications, research synthesis, and artwork.

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    drafts: false
    base_branches:
      - "main"

  tools:
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true
