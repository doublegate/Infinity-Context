#
# Gitleaks configuration for Infinity-Context (icx).
# Extends the default Gitleaks ruleset while allowlisting the synthetic
# credential and PEM redaction test vectors inside crates/icx-codec/src/redact.rs
# and the synthetic merge-commit test step in .github/workflows/ci.yml.

title = "Infinity-Context (icx) Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Synthetic unit-test fixtures for Pre-Hash SecretRedactor and CI merge-commit test"
paths = [
  '''crates/icx-codec/src/redact\.rs''',
]
regexes = [
  '''b3BlbnNzaC1rZXktdjEAAAAABG5vbmU=''',
]
